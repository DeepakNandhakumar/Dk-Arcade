<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack a Mole</title>
    <style>
    body{
            font-family:'Times New Roman', Times, serif;
            text-align: center;
            background: url("./mario-bg.jpg");
            background-size: cover;
        }
        
    h1{
        font-size: 55px;
    }
    h2{
        font-size:32px;
    }

    #board {
        width: 540px;
        height: 540px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        background: url("./soil.png");
        background-size: cover;
        border: 3px solid white;
        border-radius: 25px;
    }

    #board div {
        /* board = 540 x 540, divide into 3x3 tiles --> 180 x 180 per div */
        width: 180px; 
        height: 180px;
        background-image: url("./pipe.png");
        background-size: cover;
    }

    #board div img {
        /* all img tags inside tiles */
        width: 100px;
        height: 100px;
        user-select: none;
        -moz-user-select: none;
        -webkit-user-drag: none;
        -webkit-user-select: none;
        -ms-user-select: none;
    }
    #board div:hover {
            transform: scale(1.01);
        }
        
    
/* Keep the complete 3x3 game visible without scrolling */
*{box-sizing:border-box}html,body{width:100%;height:100%;min-height:0;margin:0;overflow:hidden}body{padding:clamp(4px,1vh,10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,.6vh,7px);background-position:center;background-size:cover}h1{font-size:clamp(1.25rem,4vh,2.5rem);line-height:1.05;margin:0}h2{font-size:clamp(1rem,3vh,1.8rem);line-height:1;margin:0}#board{width:min(540px,88vw,68svh);height:auto;aspect-ratio:1;margin:0;flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));flex-wrap:initial;overflow:hidden}#board div{width:auto;height:auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background-size:cover}#board div img{width:min(100%,90px);height:auto;max-height:90%;object-fit:contain}@media(max-height:650px){#board{width:min(540px,82vw,60svh)}}
</style>
</head>
<body>
    <h1>Whac a Mole</h1>
    <h2 id="score">0</h2>
    <!-- 3x3 -->
    <div id="board">
    </div>

    <script>
        let currMoleTile;
let currPlantTile;
let score = 0;
let gameOver = false;

window.onload = function() {
    setGame();
}

function setGame() {
    //set up the grid in html
    for (let i = 0; i < 9; i++) { //i goes from 0 to 8, stops at 9
        //<div id="0-8"></div>
        let tile = document.createElement("div");
        tile.id = i.toString();
        tile.addEventListener("click", selectTile);
        document.getElementById("board").appendChild(tile);
    }
    setInterval(setMole, 1000); // 1000 miliseconds = 1 second, every 1 second call setMole
    setInterval(setPlant, 2000); // 2000 miliseconds = 2 seconds, every 2 second call setPlant
}

function getRandomTile() {
    //math.random --> 0-1 --> (0-1) * 9 = (0-9) --> round down to (0-8) integers
    let num = Math.floor(Math.random() * 9);
    return num.toString();
}

function setMole() {
    if (gameOver) {
        return;
    }
    if (currMoleTile) {
        currMoleTile.innerHTML = "";
    }
    let mole = document.createElement("img");
    mole.src = "./monty-mole.png";

    let num = getRandomTile();
    if (currPlantTile && currPlantTile.id == num) {
        return;
    }
    currMoleTile = document.getElementById(num);
    currMoleTile.appendChild(mole);
}

function setPlant() {
    if (gameOver) {
        return;
    }
    if (currPlantTile) {
        currPlantTile.innerHTML = "";
    }
    let plant = document.createElement("img");
    plant.src = "./piranha-plant.png";

    let num = getRandomTile();
    if (currMoleTile && currMoleTile.id == num) {
        return;
    }
    currPlantTile = document.getElementById(num);
    currPlantTile.appendChild(plant);
}

function selectTile() {
    if (gameOver) {
        return;
    }
    if (this == currMoleTile) {
        score += 10;
        document.getElementById("score").innerText = score.toString(); //update score html
    }
    else if (this == currPlantTile) {
        document.getElementById("score").innerText = "GAME OVER: " + score.toString(); //update score html
        gameOver = true;
    }
}
    </script>
</body>
</html>
