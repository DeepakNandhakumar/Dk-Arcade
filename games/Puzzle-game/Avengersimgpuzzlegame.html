<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Puzzle</title>
    <style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:0;margin:0;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#001525;background:linear-gradient(135deg,rgb(213,210,210),rgb(150,150,202));height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;gap:clamp(4px,1vh,10px)}
#title{width:auto;height:clamp(42px,9vh,82px);max-width:70vw;object-fit:contain;margin:0}
#container{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.5vw,18px);background:rgba(255,255,255,.8);padding:clamp(6px,1.2vh,14px);border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,.2);max-width:100%;max-height:76svh}
#reference-box{width:min(30vw,50svh);height:min(30vw,50svh);flex:0 1 auto;display:flex;justify-content:center;align-items:center;margin:0}
#reference-box img{width:100%;height:100%;object-fit:contain}
#board{width:min(36vw,58svh);height:min(36vw,58svh);background:lightblue;border:clamp(3px,.6vw,8px) solid #0c67ae;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));flex:0 1 auto;position:relative;overflow:hidden}
#board img{width:100%;height:100%;min-width:0;min-height:0;object-fit:cover;border:1px solid #0c67ae;cursor:grab;transition:transform .2s ease-in-out}
#board img[data-empty="true"]{background:rgba(12,103,174,.12);visibility:visible;cursor:default}
#board img.correct{border:2px solid green}
h1{font-size:clamp(14px,2.5vh,22px);line-height:1;margin:0}
#message{font-size:clamp(14px,2.5vh,22px);color:green;display:none;margin:0}
#play-again{display:none;border:0;border-radius:999px;background:#0c67ae;color:white;padding:9px 20px;font-weight:700;font-size:clamp(13px,2vh,16px);cursor:pointer}
@media(max-aspect-ratio:1/1){#container{flex-direction:column;max-height:80svh}#reference-box{display:none}#board{width:min(72vw,48svh);height:min(72vw,48svh)}#title{max-width:70vw}}
@media(max-height:620px){body{padding:3px;gap:4px}#title{height:clamp(30px,7vh,46px)}#container{max-height:78svh}#reference-box{width:min(25vw,40svh);height:min(25vw,40svh)}#board{width:min(32vw,48svh);height:min(32vw,48svh)}}
</style>
</head>
<body>
    <img id="title" src="logo1.png" alt="Slide Puzzle">
    <div id="container">
        <div id="reference-box">
            <img src="26.jpg" alt="Reference Image"> <!-- Add your reference image here -->
        </div>
        <div id="board"></div>
    </div>
    <h1>Turns: <span id="turns">0</span></h1>
    <div id="message">Congratulations! You solved the puzzle!</div>
    <button id="play-again" type="button" onclick="restartPuzzle()">Play Again ↻</button>

    <script>
        const rows = 5, columns = 5;
        let currTile = null, otherTile = null, turns = 0, solved = false;
        const solvedOrder = Array.from({length:24},(_,i)=>String(i+1)).concat("");
        let imgOrder = [];

        window.onload = startPuzzle;

        function startPuzzle() {
            const board = document.getElementById("board");
            board.innerHTML = "";
            turns = 0;
            solved = false;
            currTile = null;
            otherTile = null;
            document.getElementById("turns").innerText = "0";
            document.getElementById("message").style.display = "none";
            document.getElementById("play-again").style.display = "none";

            // Begin from the solved layout and shuffle by valid moves so the puzzle is always solvable.
            imgOrder = [...solvedOrder];
            for (let i = 0; i < 180; i++) {
                const empty = imgOrder.indexOf("");
                const candidates = [];
                if (empty % columns > 0) candidates.push(empty - 1);
                if (empty % columns < columns - 1) candidates.push(empty + 1);
                if (empty >= columns) candidates.push(empty - columns);
                if (empty < rows * columns - columns) candidates.push(empty + columns);
                const pick = candidates[Math.floor(Math.random() * candidates.length)];
                [imgOrder[empty], imgOrder[pick]] = [imgOrder[pick], imgOrder[empty]];
            }

            imgOrder.forEach((value,index) => {
                const tile = document.createElement("img");
                tile.id = Math.floor(index / columns) + "-" + (index % columns);
                tile.draggable = value !== "";
                tile.alt = value ? "Puzzle tile " + value : "Empty puzzle space";
                if (value) tile.src = value + ".jpg";
                else {
                    tile.dataset.empty = "true";
                    tile.src = "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";
                }
                tile.addEventListener("dragstart", dragStart);
                tile.addEventListener("dragover", dragOver);
                tile.addEventListener("dragenter", dragEnter);
                tile.addEventListener("drop", dragDrop);
                tile.addEventListener("dragend", dragEnd);
                tile.addEventListener("click", () => moveTile(tile));
                board.append(tile);
            });
        }

        function dragStart(e) {
            if (solved || this.dataset.empty === "true") { e.preventDefault(); return; }
            currTile = this;
        }
        function dragOver(e) { e.preventDefault(); }
        function dragEnter(e) { e.preventDefault(); }
        function dragDrop() { otherTile = this; }
        function dragEnd() {
            if (!otherTile || !currTile || currTile === otherTile || solved) return;
            swapIfAdjacent(currTile, otherTile);
            currTile = null;
            otherTile = null;
        }
        function moveTile(tile) {
            if (solved || tile.dataset.empty === "true") return;
            const empty = document.querySelector('#board img[data-empty="true"]');
            if (empty) swapIfAdjacent(tile, empty);
        }
        function swapIfAdjacent(first, second) {
            const a = first.id.split("-").map(Number), b = second.id.split("-").map(Number);
            if (Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) !== 1) return;
            const firstSrc = first.getAttribute("src"), secondSrc = second.getAttribute("src");
            const firstEmpty = first.dataset.empty === "true", secondEmpty = second.dataset.empty === "true";
            if (secondEmpty) { first.removeAttribute("src"); first.dataset.empty = "true"; first.draggable = false; first.alt = "Empty puzzle space"; }
            else { first.src = secondSrc; delete first.dataset.empty; first.draggable = true; }
            if (firstEmpty) { second.removeAttribute("src"); second.dataset.empty = "true"; second.draggable = false; second.alt = "Empty puzzle space"; }
            else { second.src = firstSrc; delete second.dataset.empty; second.draggable = true; }
            turns++;
            document.getElementById("turns").innerText = turns;
            checkPuzzleSolved();
        }
        function checkPuzzleSolved() {
            const tiles = [...document.querySelectorAll("#board img")];
            const solvedNow = tiles.every((tile,index) => {
                const value = tile.dataset.empty === "true" ? "" : tile.getAttribute("src").split("/").pop().replace(".jpg","");
                const correct = value === solvedOrder[index];
                tile.classList.toggle("correct",correct && value !== "");
                return correct;
            });
            if (solvedNow) {
                solved = true;
                document.getElementById("message").style.display = "block";
                document.getElementById("play-again").style.display = "inline-flex";
                document.querySelectorAll("#board img").forEach(tile => tile.draggable = false);
            }
        }
        function restartPuzzle() { startPuzzle(); }
    </script>
</body>
</html>
